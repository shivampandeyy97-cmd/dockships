services:
  - type: web
    name: dockships
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4001"
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: resend
      - key: SMTP_FROM
        value: Dockships <contact@rollinhead.com>
      # Set SMTP_PASS in Render Dashboard → Environment (Resend API key)
      # Also set SCRAPERAPI_KEY in Render Dashboard → Environment
