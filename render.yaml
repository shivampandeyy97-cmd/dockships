services:
  - type: web
    name: dockships
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_PATH
        value: /app/apps/backend/dockships.db
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4001"
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: resend
      - key: SMTP_FROM
        value: Dockships <contact@rollinhead.com>
      # ── Supabase (persistent cloud database via HTTPS REST, always works on Render) ──
      # Get these from: https://supabase.com/dashboard/project/ohsamtseriqghmfyiszi/settings/api
      - key: SUPABASE_URL
        value: https://ohsamtseriqghmfyiszi.supabase.co
      # Set SUPABASE_SERVICE_KEY in Render Dashboard → Environment (DO NOT commit service key)
      # It's the "service_role" key (NOT the anon key) from Supabase Project Settings > API

